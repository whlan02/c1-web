<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="C1 德语" />
  <title>C1 德语</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <main class="home">
    <h1>C1 德语</h1>
    <p class="lead">自己用的阅读页。用 Safari 打开后可以「添加到主屏幕」。</p>
    <div class="cards" id="cards"></div>
  </main>
  <script src="js/docs.js"></script>
  <script src="js/prompts.js"></script>
  <script>
    const cards = document.getElementById("cards");
    Object.keys(window.C1_DOCS).forEach(function (key) {
      const d = window.C1_DOCS[key];
      const a = document.createElement("a");
      a.className = "card";
      a.href = "doc.html?doc=" + encodeURIComponent(key);
      a.innerHTML =
        '<p class="kicker">' + d.kicker + "</p>" +
        "<h2>" + d.title + "</h2>" +
        "<p>" + d.blurb + "</p>";
      cards.appendChild(a);
    });

    function addCopyPrompt(id, title, blurb) {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "card as-btn";
      btn.innerHTML =
        '<p class="kicker">Copy prompt</p>' +
        "<h2>" + title + "</h2>" +
        "<p>" + blurb + "</p>";
      btn.addEventListener("click", async function () {
        const text = window.C1_PROMPTS[id];
        try {
          await navigator.clipboard.writeText(text);
        } catch (err) {
          const ta = document.createElement("textarea");
          ta.value = text;
          document.body.appendChild(ta);
          ta.select();
          document.execCommand("copy");
          ta.remove();
        }
        btn.classList.add("copied");
        setTimeout(function () {
          btn.classList.remove("copied");
        }, 1600);
      });
      cards.appendChild(btn);
    }

    addCopyPrompt(
      "teil1",
      "Copy prompt · Schreiben 1",
      "复制后去手机 AI 里贴；再把题目原文接在最后那句英文后面。"
    );
    addCopyPrompt(
      "teil2",
      "Copy prompt · Schreiben 2",
      "复制后去手机 AI 里贴；再把题目原文接在最后那句英文后面。"
    );

    const verbs = document.createElement("a");
    verbs.className = "card";
    verbs.href = "verbs.html";
    verbs.innerHTML =
      '<p class="kicker">词汇</p>' +
      "<h2>常用动词 + 前缀</h2>" +
      "<p>点进一个动词，看常用前缀、意思和搭配。可挡住中文或德文自测。</p>";
    cards.appendChild(verbs);

    const settings = document.createElement("a");
    settings.className = "card";
    settings.href = "settings.html";
    settings.innerHTML =
      '<p class="kicker">设置</p>' +
      "<h2>OpenRouter API key</h2>" +
      "<p>只存在你这台设备的浏览器里，用来调用 GPT-5.6 Luna。</p>";
    cards.appendChild(settings);

  </script>
</body>
</html>
